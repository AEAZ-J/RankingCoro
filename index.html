<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f8fafc">
  <meta name="description" content="Ranking de coros Juntos Suena Mejor, actualizado automáticamente.">
  <title>Ranking de coros</title>
  <link rel="stylesheet" href="styles.css?v=20261003-11">
</head>
<body>
  <main class="wrap">
    <header class="hero">
      <button id="themeToggle" class="theme-toggle" type="button" aria-label="Cambiar entre modo día y noche" title="Cambiar modo">
        <span id="themeIcon" aria-hidden="true">🌙</span>
        <span id="themeLabel" class="sr-only">Modo noche</span>
      </button>

      <div class="hero-copy">
        <p class="eyebrow">Juntos Suena Mejor</p>
        <h1>Ranking por votos</h1>
        <p class="sub">Ranking general y por nivel a partir de la votación pública.</p>
      </div>

      <div class="hero-actions">
        <div class="statusbox">
          <span id="dot" class="dot"></span>
          <div class="status-text">
            <strong id="status">Cargando…</strong>
            <small id="updated">—</small>
          </div>
        </div>
      </div>
    </header>

    <section id="warning" class="warning hidden" role="status"></section>

    <section class="summary" aria-label="Resumen">
      <div><span id="groupCount">—</span><small>coros</small></div>
      <div><span id="voteCount">—</span><small>votos</small></div>
      <div><span id="levelCount">—</span><small>niveles</small></div>
    </section>

    <nav id="tabs" class="tabs" aria-label="Niveles"></nav>

    <section class="category-total" aria-live="polite">
      <div class="category-total-info">
        <span id="categoryTotalLabel">Intermedio</span>
        <small id="categoryChange" class="category-change">Últ. — · 1h — · 6h — · 12h — · 24h —</small>
      </div>
      <strong id="categoryVoteCount">— votos</strong>
    </section>

    <section id="rankings" class="rankings" aria-live="polite"></section>

    <footer>
      <p>Fuente: <a href="https://app.juntossuenamejor.cl/votacion" target="_blank" rel="noopener">votación pública Juntos Suena Mejor</a>.</p>
    </footer>
  </main>
  <script src="app.js?v=20261003-11"></script>
</body>
</html>
