name: Watchdog ranking

on:
  workflow_run:
    workflows:
      - Actualizar ranking
    types:
      - completed
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/watchdog-ranking.yml"

permissions:
  contents: read
  actions: write

concurrency:
  group: ranking-watchdog
  cancel-in-progress: true

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Restaurar la publicación vigente tras un despliegue antiguo
        if: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          CURRENT_SHA=$(gh api "repos/${{ github.repository }}/git/ref/heads/main" --jq '.object.sha')
          if [ "$EVENT_SHA" != "$CURRENT_SHA" ]; then
            echo "::warning::Terminó una ejecución antigua ($EVENT_SHA); republicando main $CURRENT_SHA."
            gh workflow run update-ranking.yml --ref main -f wait_before_update=false
          else
            echo "La última ejecución ya corresponde a la versión vigente."
          fi

      - name: Comprobar y recuperar cadena
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          CUTOFF="2026-10-11T03:05:00Z"
          CUTOFF_EPOCH=$(date -u -d "$CUTOFF" +%s)
          NOW_EPOCH=$(date -u +%s)

          if [ "$NOW_EPOCH" -ge "$CUTOFF_EPOCH" ]; then
            echo "Votación finalizada: watchdog desactivado por fecha."
            exit 0
          fi

          RUNS=$(curl --fail-with-body -sS -L \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/update-ranking.yml/runs?per_page=30")

          HEALTHY=$(printf '%s' "$RUNS" | jq --argjson now "$NOW_EPOCH" '[
            .workflow_runs[]
            | select(
                .status == "queued" or
                .status == "in_progress" or
                .status == "waiting" or
                .status == "pending" or
                .status == "requested"
              )
            | . + {updated_epoch: ((.updated_at // .created_at) | fromdateiso8601)}
            | select(($now - .updated_epoch) < 900)
          ] | length')

          STALE=$(printf '%s' "$RUNS" | jq --argjson now "$NOW_EPOCH" '[
            .workflow_runs[]
            | select(
                .status == "queued" or
                .status == "in_progress" or
                .status == "waiting" or
                .status == "pending" or
                .status == "requested"
              )
            | . + {updated_epoch: ((.updated_at // .created_at) | fromdateiso8601)}
            | select(($now - .updated_epoch) >= 900)
          ] | length')

          if [ "$HEALTHY" -gt 0 ]; then
            echo "Cadena saludable: $HEALTHY ejecución(es) activa(s) reciente(s)."
            exit 0
          fi

          if [ "$STALE" -gt 0 ]; then
            echo "::warning::Hay $STALE ejecución(es) activa(s) sin progreso por más de 15 minutos."
          else
            echo "::warning::No hay ninguna ejecución activa de Actualizar ranking."
          fi

          SUCCESS=0
          for WAIT in 0 5 15 30; do
            if [ "$WAIT" -gt 0 ]; then
              sleep "$WAIT"
            fi

            HTTP_CODE=$(curl -sS -o /tmp/dispatch-response.txt -w "%{http_code}" -L -X POST \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${{ github.repository }}/actions/workflows/update-ranking.yml/dispatches" \
              -d '{"ref":"main","inputs":{"wait_before_update":"false"}}' || true)

            if [ "$HTTP_CODE" = "204" ]; then
              echo "Cadena reactivada con actualización inmediata."
              SUCCESS=1
              break
            fi

            echo "Intento de recuperación falló (HTTP $HTTP_CODE)."
            cat /tmp/dispatch-response.txt || true
          done

          if [ "$SUCCESS" -ne 1 ]; then
            echo "::error::El watchdog no pudo reactivar la cadena."
            exit 1
          fi
