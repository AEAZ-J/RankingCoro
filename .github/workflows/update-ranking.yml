name: Actualizar ranking

on:
  # Respaldo independiente: recupera actualizaciones si se corta el relevo.
  schedule:
    - cron: '3-58/5 * * * *'
  workflow_dispatch:
    inputs:
      wait_before_update:
        description: "Esperar 5 minutos antes de leer la API"
        required: false
        default: "true"
  push:
    branches:
      - main
    paths:
      - "app.js"
      - "insights.js"
      - "index.html"
      - "styles.css"
      - ".github/workflows/update-ranking.yml"

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    concurrency:
      group: ${{ github.event_name == 'push' && 'ranking-code-publish' || 'ranking-data-cycle' }}
      cancel-in-progress: ${{ github.event_name == 'push' }}

    steps:
      - name: Programar relevo
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          CUTOFF="2026-10-11T03:05:00Z"
          CUTOFF_EPOCH=$(date -u -d "$CUTOFF" +%s)
          NOW_EPOCH=$(date -u +%s)

          if [ "$NOW_EPOCH" -ge "$CUTOFF_EPOCH" ]; then
            echo "Votación finalizada: no se crea otro relevo."
            exit 0
          fi

          SUCCESS=0
          for WAIT in 0 5 15 30; do
            if [ "$WAIT" -gt 0 ]; then
              sleep "$WAIT"
            fi

            HTTP_CODE=$(curl -sS -o /tmp/dispatch-response.txt -w "%{http_code}" -L -X POST \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${{ github.repository }}/actions/workflows/update-ranking.yml/dispatches" \
              -d '{"ref":"main","inputs":{"wait_before_update":"true"}}' || true)

            if [ "$HTTP_CODE" = "204" ]; then
              echo "Relevo creado correctamente."
              SUCCESS=1
              break
            fi

            echo "Intento de relevo falló (HTTP $HTTP_CODE)."
            cat /tmp/dispatch-response.txt || true
          done

          if [ "$SUCCESS" -ne 1 ]; then
            echo "::warning::No se pudo crear el relevo; el watchdog intentará recuperar la cadena."
          fi

      - name: Mantener cadencia
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.wait_before_update != 'false' }}
        run: |
          echo "Esperando 5 minutos antes de la siguiente lectura."
          sleep 300

      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Validar archivos
        run: |
          node --check app.js
          node --check insights.js
          node --check scripts/fetch-api.mjs
          node -e "const fs=require('fs'); JSON.parse(fs.readFileSync('data.json','utf8')); JSON.parse(fs.readFileSync('history.json','utf8'));"

      - name: Leer API de votación
        timeout-minutes: 3
        run: node scripts/fetch-api.mjs

      - name: Preparar sitio
        run: |
          rm -rf _site
          mkdir -p _site
          cp index.html styles.css app.js insights.js data.json history.json _site/

      - name: Agregar diagnóstico de publicación
        run: |
          node --input-type=module <<'NODE'
          import {readFileSync,writeFileSync} from 'node:fs';
          const data=JSON.parse(readFileSync('_site/data.json','utf8'));
          const history=JSON.parse(readFileSync('_site/history.json','utf8'));
          const health={
            deployedFromWorkflowAt:new Date().toISOString(),
            githubRunId:process.env.GITHUB_RUN_ID||null,
            githubRunAttempt:process.env.GITHUB_RUN_ATTEMPT||null,
            sourceUpdatedAt:data.updatedAt||null,
            lastAttemptAt:data.lastAttemptAt||null,
            stale:Boolean(data.stale),
            error:data.stale?(data.error||'Datos no actualizados'):null,
            snapshots:Array.isArray(history.snapshots)?history.snapshots.length:0
          };
          writeFileSync('_site/health.json',JSON.stringify(health,null,2)+'\n');
          console.log('Diagnóstico de publicación:', JSON.stringify(health));
          NODE

      - name: Configurar Pages
        uses: actions/configure-pages@v5

      - name: Subir sitio
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./_site

  deploy:
    needs: update
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: ranking-pages-deploy-current
      cancel-in-progress: false
    environment:
      name: ranking-pages
      url: ${{ steps.deployment.outputs.page_url }}

    # Nunca se cancela la publicación por diferencias entre github.sha y main:
    # los datos actualizados se generan dentro del propio job update.
    steps:
      - name: Publicar los datos ya preparados
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          timeout: 240000
