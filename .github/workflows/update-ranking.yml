name: Actualizar ranking

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Programar relevo
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          CUTOFF="2026-10-11T03:05:00Z"
          CUTOFF_EPOCH=$(date -u -d "$CUTOFF" +%s)
          NOW_EPOCH=$(date -u +%s)

          if [ "$NOW_EPOCH" -ge "$CUTOFF_EPOCH" ]; then
            echo "Votación finalizada: no se crea otro relevo."
            exit 0
          fi

          SUCCESS=0
          for WAIT in 0 5 15 30; do
            if [ "$WAIT" -gt 0 ]; then
              sleep "$WAIT"
            fi

            HTTP_CODE=$(curl -sS -o /tmp/dispatch-response.txt -w "%{http_code}" -L -X POST \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${{ github.repository }}/actions/workflows/update-ranking.yml/dispatches" \
              -d '{"ref":"main"}' || true)

            if [ "$HTTP_CODE" = "204" ]; then
              echo "Relevo creado correctamente."
              SUCCESS=1
              break
            fi

            echo "Intento de relevo falló (HTTP $HTTP_CODE)."
            cat /tmp/dispatch-response.txt || true
          done

          if [ "$SUCCESS" -ne 1 ]; then
            echo "::warning::No se pudo crear el relevo; el watchdog intentará recuperar la cadena."
          fi

      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Validar archivos
        run: |
          node --check app.js
          node --check scripts/fetch-api.mjs
          node -e "const fs=require('fs'); JSON.parse(fs.readFileSync('data.json','utf8')); JSON.parse(fs.readFileSync('history.json','utf8'));"

      - name: Leer API de votación
        timeout-minutes: 2
        run: node scripts/fetch-api.mjs

      - name: Preparar sitio
        run: |
          rm -rf _site
          mkdir -p _site
          cp index.html styles.css app.js data.json history.json _site/

      - name: Configurar Pages
        uses: actions/configure-pages@v5

      - name: Subir sitio
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

      - name: Publicar
        id: deployment
        timeout-minutes: 3
        uses: actions/deploy-pages@v4

      - name: Mantener cadencia
        if: success()
        run: |
          CUTOFF="2026-10-11T03:05:00Z"
          CUTOFF_EPOCH=$(date -u -d "$CUTOFF" +%s)
          NOW_EPOCH=$(date -u +%s)

          if [ "$NOW_EPOCH" -ge "$CUTOFF_EPOCH" ]; then
            echo "Votación finalizada: no es necesario mantener la espera."
            exit 0
          fi

          echo "Relevo ya está en espera; manteniendo cadencia de aproximadamente 5 minutos."
          sleep 300
