name: Actualizar ranking

on:
  # Reinicia el worker periódicamente. Si GitHub retrasa este cron,
  # el worker anterior sigue actualizando los datos durante varias horas.
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "app.js"
      - "insights.js"
      - "index.html"
      - "styles.css"
      - "scripts/fetch-api.mjs"
      - ".github/workflows/update-ranking.yml"

permissions:
  contents: write
  pages: write
  id-token: write

# Un solo worker de datos. Un nuevo schedule/push reemplaza al anterior.
concurrency:
  group: ranking-live-worker-v3
  cancel-in-progress: true

jobs:
  live-data:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validar archivos
        run: |
          node --check app.js
          node --check insights.js
          node --check scripts/fetch-api.mjs
          node -e "const fs=require('fs'); JSON.parse(fs.readFileSync('data.json','utf8')); JSON.parse(fs.readFileSync('history.json','utf8'));"

      - name: Actualizar datos cada 5 minutos
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          CUTOFF="2026-10-11T03:05:00Z"
          CUTOFF_EPOCH=$(date -u -d "$CUTOFF" +%s)

          for ITERATION in $(seq 1 65); do
            NOW_EPOCH=$(date -u +%s)
            if [ "$NOW_EPOCH" -ge "$CUTOFF_EPOCH" ]; then
              echo "Votación finalizada: se detiene el worker."
              exit 0
            fi

            echo "=== Actualización $ITERATION/65: $(date -u +%Y-%m-%dT%H:%M:%SZ) ==="

            # Parte siempre desde el main más reciente. Los commits de datos
            # no disparan este workflow porque data/history no están en paths.
            git fetch origin main
            git reset --hard origin/main

            node scripts/fetch-api.mjs

            git add data.json history.json
            if git diff --cached --quiet; then
              echo "Sin cambios para guardar."
            else
              git commit -m "data: actualizar ranking [skip ci]"

              PUSHED=0
              for ATTEMPT in 1 2 3; do
                if git push origin HEAD:main; then
                  PUSHED=1
                  break
                fi

                echo "Push $ATTEMPT falló; sincronizando con main."
                git pull --rebase origin main || {
                  git rebase --abort || true
                  git fetch origin main
                  git reset --hard origin/main
                  node scripts/fetch-api.mjs
                  git add data.json history.json
                  git commit -m "data: actualizar ranking [skip ci]" || true
                }
                sleep $((ATTEMPT * 3))
              done

              if [ "$PUSHED" -ne 1 ]; then
                echo "::warning::No se pudo guardar esta medición; el worker reintentará en el siguiente ciclo."
              fi
            fi

            if [ "$ITERATION" -lt 65 ]; then
              sleep 300
            fi
          done

  deploy-site:
    # Los datos se sirven desde main. Pages solo necesita republicarse cuando
    # cambia el código del sitio o se solicita manualmente.
    if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment:
      name: ranking-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v7

      - name: Preparar sitio
        run: |
          rm -rf _site
          mkdir -p _site
          cp index.html styles.css app.js insights.js data.json history.json _site/

      - name: Agregar diagnóstico
        run: |
          node --input-type=module <<'NODE'
          import {readFileSync,writeFileSync} from 'node:fs';
          const data=JSON.parse(readFileSync('_site/data.json','utf8'));
          const history=JSON.parse(readFileSync('_site/history.json','utf8'));
          const health={
            deployedFromWorkflowAt:new Date().toISOString(),
            githubRunId:process.env.GITHUB_RUN_ID||null,
            githubRunAttempt:process.env.GITHUB_RUN_ATTEMPT||null,
            sourceUpdatedAt:data.updatedAt||null,
            lastAttemptAt:data.lastAttemptAt||null,
            stale:Boolean(data.stale),
            error:data.stale?(data.error||'Datos no actualizados'):null,
            snapshots:Array.isArray(history.snapshots)?history.snapshots.length:0
          };
          writeFileSync('_site/health.json',JSON.stringify(health,null,2)+'\n');
          NODE

      - name: Configurar Pages
        uses: actions/configure-pages@v6

      - name: Subir sitio
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./_site

      - name: Publicar sitio
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          timeout: 240000
