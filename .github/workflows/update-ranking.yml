name: Actualizar ranking

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Validar archivos
        run: |
          node --check app.js
          node --check scripts/fetch-api.mjs
          node -e "const fs=require('fs'); JSON.parse(fs.readFileSync('data.json','utf8')); JSON.parse(fs.readFileSync('history.json','utf8'));"

      - name: Leer API de votación
        run: node scripts/fetch-api.mjs

      - name: Preparar sitio
        run: |
          mkdir -p _site
          cp index.html styles.css app.js data.json history.json _site/

      - name: Configurar Pages
        uses: actions/configure-pages@v5

      - name: Subir sitio
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Programar próxima actualización
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          CUTOFF="2026-10-11T03:05:00Z"
          CUTOFF_EPOCH=$(date -u -d "$CUTOFF" +%s)
          NOW_EPOCH=$(date -u +%s)

          if [ "$NOW_EPOCH" -ge "$CUTOFF_EPOCH" ]; then
            echo "Votación finalizada: no se programan más actualizaciones."
            exit 0
          fi

          sleep 300

          NOW_EPOCH=$(date -u +%s)
          if [ "$NOW_EPOCH" -ge "$CUTOFF_EPOCH" ]; then
            echo "Se alcanzó el corte del 11-oct 00:05 America/Santiago."
            exit 0
          fi

          curl --fail-with-body -L -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/update-ranking.yml/dispatches" \
            -d '{"ref":"main"}'
