name: Actualizar ranking

on:
  # El relevo mantiene la cadencia. Este cron de respaldo recupera la cadena si se corta.
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "app.js"
      - "insights.js"
      - "index.html"
      - "styles.css"
      - ".github/workflows/update-ranking.yml"

permissions:
  contents: write
  pages: write
  id-token: write
  actions: write

# Una sola ejecución integral a la vez: evita desplegar datos antiguos
# sobre publicaciones más recientes y no genera ejecuciones encadenadas.
concurrency:
  group: ranking-pages-update-v2
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v7

      - name: Validar archivos
        run: |
          node --check app.js
          node --check insights.js
          node --check scripts/fetch-api.mjs
          node -e "const fs=require('fs'); JSON.parse(fs.readFileSync('data.json','utf8')); JSON.parse(fs.readFileSync('history.json','utf8'));"

      - name: Leer API de votación
        timeout-minutes: 3
        run: node scripts/fetch-api.mjs

      - name: Guardar datos frescos en main
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json history.json
          if git diff --cached --quiet; then
            echo "Sin cambios de datos."
          else
            git commit -m "data: actualizar ranking [skip ci]"
            git push origin HEAD:main || {
              git pull --rebase origin main
              git push origin HEAD:main
            }
          fi

      - name: Preparar sitio
        run: |
          rm -rf _site
          mkdir -p _site
          cp index.html styles.css app.js insights.js data.json history.json _site/

      - name: Agregar diagnóstico de publicación
        run: |
          node --input-type=module <<'NODE'
          import {readFileSync,writeFileSync} from 'node:fs';
          const data=JSON.parse(readFileSync('_site/data.json','utf8'));
          const history=JSON.parse(readFileSync('_site/history.json','utf8'));
          const health={
            deployedFromWorkflowAt:new Date().toISOString(),
            githubRunId:process.env.GITHUB_RUN_ID||null,
            githubRunAttempt:process.env.GITHUB_RUN_ATTEMPT||null,
            sourceUpdatedAt:data.updatedAt||null,
            lastAttemptAt:data.lastAttemptAt||null,
            stale:Boolean(data.stale),
            error:data.stale?(data.error||'Datos no actualizados'):null,
            snapshots:Array.isArray(history.snapshots)?history.snapshots.length:0
          };
          writeFileSync('_site/health.json',JSON.stringify(health,null,2)+'\n');
          console.log('Diagnóstico de publicación:', JSON.stringify(health));
          NODE

      - name: Configurar Pages
        uses: actions/configure-pages@v6

      - name: Subir sitio
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./_site

  relay:
    needs: update
    if: ${{ always() && needs.update.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 7

    steps:
      - name: Mantener cadena de actualización
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          CUTOFF="2026-10-11T03:05:00Z"
          NOW_EPOCH=$(date -u +%s)
          CUTOFF_EPOCH=$(date -u -d "$CUTOFF" +%s)
          if [ "$NOW_EPOCH" -ge "$CUTOFF_EPOCH" ]; then
            echo "Votación finalizada: no se programa otro relevo."
            exit 0
          fi

          # El resto del workflow añade algunos segundos; 270 s deja el ciclo
          # de lectura de datos cerca de 5 minutos de inicio a inicio.
          echo "Próxima actualización en aproximadamente 5 minutos."
          sleep 270

          # Evita duplicar un relevo si apareció otra ejecución mientras esperábamos.
          NOW_EPOCH=$(date -u +%s)
          RUNS=$(gh api "repos/${{ github.repository }}/actions/runs?per_page=20")
          ACTIVE=$(printf '%s' "$RUNS" | jq --arg current "$GITHUB_RUN_ID" '[
            .workflow_runs[]
            | select(.name == "Actualizar ranking")
            | select((.id|tostring) != $current)
            | select(
                .status == "queued" or
                .status == "in_progress" or
                .status == "waiting" or
                .status == "pending" or
                .status == "requested"
              )
          ] | length')

          if [ "$ACTIVE" -gt 0 ]; then
            echo "Ya existe otra ejecución activa; no se duplica el relevo."
            exit 0
          fi

          HTTP_CODE=$(curl -sS --connect-timeout 5 --max-time 20 -o /tmp/relay-response.txt -w "%{http_code}" -L -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/update-ranking.yml/dispatches" \
            -d '{"ref":"main"}' || true)

          if [ "$HTTP_CODE" != "204" ]; then
            echo "::error::No se pudo enviar el relevo (HTTP $HTTP_CODE)."
            cat /tmp/relay-response.txt || true
            exit 1
          fi
          echo "Relevo enviado correctamente."

  deploy:
    needs: update
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: ranking-pages
      url: ${{ steps.deployment.outputs.page_url }}

    # Nunca se cancela la publicación por diferencias entre github.sha y main:
    # los datos actualizados se generan dentro del propio job update.
    steps:
      - name: Publicar los datos ya preparados
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          timeout: 240000

  deploy-retry:
    needs: [update, deploy]
    if: ${{ always() && needs.update.result == 'success' && needs.deploy.result == 'failure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: ranking-pages

    steps:
      - name: Esperar antes de reintentar Pages
        run: sleep 20

      - name: Reintentar publicación
        uses: actions/deploy-pages@v5
        with:
          timeout: 240000
