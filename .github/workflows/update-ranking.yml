name: Actualizar ranking

on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  scrape-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Probar API directa y CORS
        shell: bash
        run: |
          set +e
          code=$(curl -sS -o /tmp/api.json -D /tmp/api.headers -w "%{http_code}"             -H "Origin: https://aeaz-j.github.io"             "https://app.juntossuenamejor.cl/api/voting/choirs?round_code=first")
          echo "API_HTTP_STATUS=$code"
          echo "CORS headers:"
          grep -i "^access-control-" /tmp/api.headers || true
          echo "Response structure:"
          python - <<'PY'
          import json
          with open('/tmp/api.json', encoding='utf-8') as f:
              data=json.load(f)
          choirs=data.get('choirs', [])
          print("CHOIR_COUNT=", len(choirs))
          if choirs:
              first=choirs[0]
              print("CHOIR_KEYS=", sorted(first.keys()))
              print("VOTE_FIELDS=", {k:v for k,v in first.items() if 'vote' in k.lower()})
              print("CATEGORY_SAMPLE=", first.get('competition_category'))
              print("CATEGORIES=", sorted({str(c.get('competition_category')) for c in choirs}))
          PY

      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Instalar Playwright
        run: |
          npm install
          npx playwright install --with-deps chromium

      - name: Leer votación
        run: npm run scrape

      - name: Configurar Pages
        uses: actions/configure-pages@v5

      - name: Subir sitio
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4